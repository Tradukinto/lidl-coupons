<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Lidl Пафос — Скидки и Купоны семьи</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css?v=2.2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="app-header">
      <div class="header-top">
        <div class="brand">
          <span class="lidl-logo">LIDL</span>
          <span class="badge-plus">+ Семья</span>
          <span class="version-tag">v2.2</span>
        </div>
        <div class="store-tag" id="store-title">Пафос • Tombs of the Kings</div>
      </div>
      
      <div class="update-bar">
        <span class="status-dot"></span>
        <span id="update-time">Загрузка данных...</span>
        <button id="refresh-btn" class="icon-btn" title="Обновить с сервера">↻</button>
      </div>

      <!-- Monetary Discount Banner (Euro Coupons) -->
      <div id="monetary-banner" class="monetary-banner hidden">
        <div class="monetary-icon">💶</div>
        <div class="monetary-content">
          <div class="monetary-title" id="monetary-title">Скидка на кассе: 1€</div>
          <div class="monetary-sub" id="monetary-sub">Скидка со всего чека при покупке</div>
        </div>
        <div class="monetary-action" id="monetary-badge">Сева</div>
      </div>

      <!-- Search Bar -->
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="Поиск товара, категории или кода SKU..." autocomplete="off">
        <button id="clear-search" class="clear-btn hidden">✕</button>
      </div>

      <!-- Family Filter Chips -->
      <div class="family-chips-scroll" id="family-chips-container">
        <div class="family-chips" id="family-chips">
          <button class="chip active" data-member="all">
            <span class="chip-avatar">👥</span>
            <span class="chip-name">Все</span>
          </button>
          <button class="chip chip-shared" data-member="shared" id="chip-shared">
            <span class="chip-avatar">✨</span>
            <span class="chip-name">Пересечения</span>
            <span class="chip-count" id="chip-shared-count">0</span>
          </button>
          <button class="chip chip-vova" data-member="Вова">
            <span class="chip-avatar">👨</span>
            <span class="chip-name">Вова</span>
          </button>
          <button class="chip chip-sveta" data-member="Света">
            <span class="chip-avatar">👩</span>
            <span class="chip-name">Света</span>
          </button>
          <button class="chip chip-vlada" data-member="Влада">
            <span class="chip-avatar">👧</span>
            <span class="chip-name">Влада</span>
          </button>
          <button class="chip chip-seva" data-member="Сева">
            <span class="chip-avatar">👦</span>
            <span class="chip-name">Сева</span>
          </button>
        </div>
      </div>

      <!-- Navigation Tabs -->
      <nav class="nav-tabs">
        <button class="tab-btn active" data-tab="double">
          <span class="tab-icon">🔥</span>
          <span class="tab-label">Комбо</span>
          <span class="tab-badge" id="badge-double">0</span>
        </button>
        <button class="tab-btn" data-tab="coupons">
          <span class="tab-icon">🎟</span>
          <span class="tab-label">Купоны</span>
          <span class="tab-badge" id="badge-coupons">0</span>
        </button>
        <button class="tab-btn" data-tab="store">
          <span class="tab-icon">🛒</span>
          <span class="tab-label">Магазин</span>
          <span class="tab-badge" id="badge-store">0</span>
        </button>
        <button class="tab-btn" data-tab="favs">
          <span class="tab-icon">⭐</span>
          <span class="tab-label">Список</span>
          <span class="tab-badge" id="badge-favs">0</span>
        </button>
      </nav>
    </header>

    <!-- Main Content List -->
    <main class="content-container">
      <!-- Favorites Toolbar (shown only in favs tab) -->
      <div id="favs-toolbar" class="favs-toolbar hidden">
        <div class="favs-progress" id="favs-progress">Куплено: 0 из 0</div>
        <div class="favs-actions">
          <button id="clear-checked-btn" class="favs-action-btn" title="Удалить купленные">✓ Купленные</button>
          <button id="clear-all-favs-btn" class="favs-action-btn text-danger" title="Очистить весь список">🗑 Очистить</button>
        </div>
      </div>
      <div id="loading-spinner" class="spinner-container">
        <div class="spinner"></div>
        <p>Загрузка каталога и скидок...</p>
      </div>

      <div id="cards-container" class="cards-list"></div>

      <div id="empty-state" class="empty-state hidden">
        <div class="empty-icon">🔍</div>
        <h3>Ничего не найдено</h3>
        <p>Попробуйте изменить запрос или выбрать фильтр «Все»</p>
      </div>
    </main>

    <!-- Scroll to Top Button -->
    <button id="scroll-top-btn" class="scroll-top-btn hidden" title="Наверх">↑</button>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="app.js?v=2.2"></script>
</body>
</html>
